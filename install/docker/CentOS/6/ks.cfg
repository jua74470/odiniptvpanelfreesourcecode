#platform=x86, AMD64, ou Intel EM64T
#version=DEVEL
# Firewall configuration
firewall --disabled
# Install OS instead of upgrade
install
# Use network installation
url --url="http://mirror.nsc.liu.se/centos-store/centos/6/os/x86_64/"
repo --name="CentOS-6-Base" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/os/x86_64/ --cost=100
repo --name="CentOS-6-Updates" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/updates/x86_64/ --cost=1000
repo --name="CentOS-6-Extras" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/extras/x86_64/ --cost=1000
repo --name="Centos-6-Plus" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/centosplus/x86_64/ --cost=1000
repo --name="CentOS-6-Contrib" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/contrib/x86_64/ --cost=1000
repo --name="CentOS-6-CR" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/cr/x86_64/ --cost=1000
repo --name="CentOS-6-" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/updates/x86_64 --cost=1000
repo --name="CentOS-6-" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/updates/x86_64 --cost=1000
repo --name="CentOS-6-" --baseurl=http://mirror.nsc.liu.se/centos-store/centos/6/updates/x86_64 --cost=1000
